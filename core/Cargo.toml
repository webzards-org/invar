[package]
name = "invar"
version = "0.1.3"
edition = "2024"
description = "Spec-driven generate-and-verify loop: the CLI that renders every verdict"
license = "MIT OR Apache-2.0"
repository = "https://github.com/webzards-org/invar"

[[bin]]
name = "invar"
path = "src/main.rs"

# Dependencies stay few and boring on purpose (§14.2). The core reads and
# writes files, parses `invar.yaml`, flat Plan headers and markdown sections,
# hashes, and shells out to `git`. No async runtime, no git library.
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.11"

# `invar.yaml` is read with a real YAML parser: it is never written back, and
# skipping the keys of later milestones correctly means parsing YAML
# (contracts/formats/invar-yaml.md, D-1). Deserialize only — the core does not
# emit YAML.
#
# These two are for `invar.yaml` only. The Plan header deliberately does NOT
# go through serde or any YAML crate: unknown keys and comments must survive a
# write in their original positions (plan-header.md D-2), and a serde round
# trip drops both. `format/plan` reads it line by line instead and writes it
# back byte for byte.
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.0", default-features = false, features = ["deserialize"] }

# `plan guard` reads the JSON a `PreToolUse` hook passes on stdin (M1-10).
# Read only, into an untyped `Value`: the payload belongs to Claude Code and
# grows fields over time, so the guard looks up the two or three it needs
# and ignores the rest. Also reads contracts/fixtures/digest/digests.json in
# tests. Writes exactly one thing: the `SubagentStart` hook's output for
# `context show --conventions --hook` (M1-24), built with `json!` so the
# conventions text is escaped correctly.
serde_json = "1"

# JUnit reports are read with a real XML parser (contracts/formats/test-results.md):
# entities, CDATA and attribute quoting are what a real report contains, and each is
# easy to get subtly wrong by hand. Streaming, with no serde and no default features,
# because the core reads two attributes and three element names and skips the rest. It
# never resolves an entity from a DTD, so a report cannot make the core read a file.
quick-xml = { version = "0.42", default-features = false }

[dev-dependencies]
assert_cmd = "2"    # end-to-end CLI tests: run the real binary
predicates = "3"    # assertions over its output
tempfile = "3"      # throwaway project trees
