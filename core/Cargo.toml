[package]
name = "invar"
version = "0.1.0"
edition = "2024"
description = "Spec-driven generate-and-verify loop: the CLI that renders every verdict"
license = "MIT"
repository = "https://github.com/webzards-org/invar"

[[bin]]
name = "invar"
path = "src/main.rs"

# Dependencies stay few and boring on purpose (§14.2). The core reads and
# writes files, parses YAML headers and markdown sections, hashes, and shells
# out to `git`. No async runtime, no git library.
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"

# `invar.yaml` is read with a real YAML parser: it is never written back, and
# skipping the keys of later milestones correctly means parsing YAML
# (contracts/formats/invar-yaml.md, D-1). Deserialize only — the core does not
# emit YAML.
#
# The Plan header deliberately does NOT go through serde: unknown keys and
# comments must survive a write byte for byte, which a serde round trip
# cannot do. It gets a line-oriented parser of its own (M1-6).
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }

[dev-dependencies]
assert_cmd = "2"    # end-to-end CLI tests: run the real binary
predicates = "3"    # assertions over its output
serde_json = "1"    # reads contracts/fixtures/digest/digests.json in tests
tempfile = "3"      # throwaway project trees
