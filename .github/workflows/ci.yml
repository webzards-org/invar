name: CI

# CI is a design position, not housekeeping. §13b makes this run the standing
# proof that no logic leaked out of the CLI into the plugin: there is no agent
# and no plugin here, so anything that only works with the plugin loaded is
# behavior CI does not have. From M3 onward the e2e suite runs here too, and
# that is what turns §10's "the full loop runs with no agent" into a test
# rather than a claim.

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings everywhere, not only in the clippy step.
  RUSTFLAGS: "-D warnings"

jobs:
  fixtures:
    name: contract fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Verifies that every fixture on disk still has the bytes the table
      # claims, and that digests.json agrees with them. This is the check that
      # catches an editor, a pre-commit hook or a git EOL filter having
      # "fixed" a fixture whose whole purpose is to be unusual.
      - name: Digest fixtures
        run: python3 tools/generate.py --check
        working-directory: contracts/fixtures/digest

      # The same check for the lock fixtures, and the table of expected results.
      - name: Lock fixtures
        run: python3 tools/generate.py --check
        working-directory: contracts/fixtures/acceptance

      # The reports came from the real runners and cannot be regenerated, so this
      # checks their bytes, and the hand-written table against them.
      - name: JUnit fixtures
        run: python3 tools/check.py --check
        working-directory: contracts/fixtures/junit

  core:
    name: core (Linux)
    runs-on: ubuntu-latest

    defaults:
      run:
        # The crate lives in core/; rustup reads core/rust-toolchain.toml from
        # here and installs the pinned compiler by itself.
        working-directory: core

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      # Caches ~/.cargo (registry, git checkouts) and core/target, keyed on
      # Cargo.lock and the toolchain. Without it every run recompiles clap and
      # sha2 from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # Ordered cheapest-first, so an obvious failure reports in seconds.
      # Every step is independent: each one failing fails the job.
      - name: Format
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  # What `core` cannot see: that Claude Code itself accepts the plugin. The
  # structure of the plugin, its agreement with the CLI and its launcher are
  # tested in `core/tests/plugin.rs`, which the `core` job runs.
  plugin:
    name: plugin (claude plugin validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # All this job needs from Claude Code is its validator.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the plugin
        run: claude plugin validate ./plugin --strict

      # The tree `release.yml` publishes: a marketplace with the plugin in
      # `invar/`. Built here without binaries, which are not part of what is
      # being checked.
      - name: Validate the marketplace
        run: |
          set -eu
          mkdir -p /tmp/marketplace/.claude-plugin /tmp/marketplace/invar
          cp plugin/marketplace.json /tmp/marketplace/.claude-plugin/marketplace.json
          cp -R plugin/.claude-plugin plugin/hooks plugin/bin /tmp/marketplace/invar/
          claude plugin validate /tmp/marketplace --strict
