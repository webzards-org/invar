name: Release plugin

# Builds the `invar` binary for each platform the plugin supports and publishes
# the plugin, binaries included, on the `dist` branch, which is the marketplace
# developers install from (plugin/NOTES.md section 13).
#
# Why a branch and not the binaries in `main`: a binary in git is one nobody
# reviewed that every clone carries forever (and `core/tests/plugin.rs` fails if
# one is committed). Why not a release asset: a plugin installed from a git
# marketplace is a checkout, and what is not in the checkout is not there.
#
# The binaries are static (musl on Linux): nothing to install first on a
# developer's machine, which is why the core is written in Rust (design 14.2).
#
# Anyone can check that a binary was built here, from the tagged commit:
# each one gets a build provenance attestation, and on a tag the binaries and
# their SHA256SUMS are also attached to a GitHub release (docs/INSTALL.md,
# "Verifying a binary"). No build cache: a release is built from the source
# alone, never from what an earlier run left behind.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: invar-linux-x86_64
          # Both macOS binaries are built on the Apple-silicon runner: the
          # Intel one is a cross-compile, which needs nothing more than the
          # target installed. `macos-15`, not `macos-14`: GitHub retired the
          # macOS 14 image on 2026-11-02. The runner's macOS does not raise the
          # oldest macOS the binaries run on: that is Rust's deployment target
          # for each target, not the build machine's version.
          - os: macos-15
            target: aarch64-apple-darwin
            name: invar-darwin-arm64
          - os: macos-15
            target: x86_64-apple-darwin
            name: invar-darwin-x86_64

    defaults:
      run:
        working-directory: core

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # rustup reads core/rust-toolchain.toml from here, so this adds the
      # target to the pinned compiler.
      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Name the binary for the launcher
        run: cp target/${{ matrix.target }}/release/invar "$GITHUB_WORKSPACE/${{ matrix.name }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

  dist:
    name: publish the plugin on `dist`
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Pushing `dist` and creating the release.
      contents: write
      # Signing the attestations (Sigstore, through GitHub's OIDC token).
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      # The marketplace is `dist` itself: `.claude-plugin/marketplace.json` at
      # its root, the plugin in `invar/`. Only what runs is copied, the
      # licenses that cover it, and the user-facing README: `README.dist.md`
      # becomes `invar/README.md`, which the plugin directory shows as the
      # listing's description. No notes and no contributor README.
      - name: Assemble the marketplace
        run: |
          set -eu
          mkdir -p dist/.claude-plugin dist/invar
          cp plugin/marketplace.json dist/.claude-plugin/marketplace.json
          cp LICENSE-MIT LICENSE-APACHE dist/
          cp LICENSE-MIT LICENSE-APACHE dist/invar/
          cp plugin/README.dist.md dist/invar/README.md
          for part in .claude-plugin hooks agents skills bin; do
            if [ -e "plugin/$part" ]; then
              cp -R "plugin/$part" dist/invar/
            fi
          done
          cp artifacts/*/invar-* dist/invar/bin/
          chmod +x dist/invar/bin/invar dist/invar/bin/invar-*
          ls -l dist/invar/bin

      # Every platform's binary has to be there, or the launcher would fail on
      # that platform with exit 127 for every developer who has it.
      - name: Check that every binary arrived
        run: |
          set -eu
          for name in invar-linux-x86_64 invar-darwin-arm64 invar-darwin-x86_64; do
            test -x "dist/invar/bin/$name" || { echo "missing $name"; exit 1; }
          done

      # The one binary this runner can run: through the launcher, as a hook
      # would.
      - name: Smoke test
        run: dist/invar/bin/invar --version

      - name: Checksums
        run: |
          set -eu
          cd dist/invar/bin
          sha256sum invar-* > "$GITHUB_WORKSPACE/SHA256SUMS"
          cat "$GITHUB_WORKSPACE/SHA256SUMS"

      # Signed statement that each binary was built by this workflow, from this
      # commit. Checked with `gh attestation verify <file> --repo <owner>/invar`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/invar/bin/invar-*

      # The check a user would run, here first: a release that cannot be
      # verified is not published.
      - name: Verify the attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for f in dist/invar/bin/invar-*; do
            gh attestation verify "$f" --repo "${{ github.repository }}"
          done

      - name: Publish on dist
        run: |
          set -eu
          cd dist
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "invar plugin ${GITHUB_REF_NAME}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:dist

      # For the CLI outside Claude Code and for CI: the same binaries as on
      # `dist`, with their checksums, without cloning a branch. Only on a tag;
      # a manual run publishes `dist` alone.
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "invar $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. Verify a binary with: gh attestation verify <file> --repo ${{ github.repository }}" \
            dist/invar/bin/invar-* SHA256SUMS
