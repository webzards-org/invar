name: Beta feedback
description: How Invar worked on your project, good or bad. This decides what goes into the next release.
labels: ["beta-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Short answers are fine. What matters most is what got in your way.
        Leave out business rules, client names and proprietary code: this issue is public.

  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: The kind of project, and how many tickets you took through the cycle.
      placeholder: A FastAPI service with about 40 modules; three tickets, one of them split.
    validations:
      required: true

  - type: textarea
    id: helped
    attributes:
      label: What helped
      description: A moment where Invar caught something, saved time, or made a decision clearer.

  - type: textarea
    id: got_in_the_way
    attributes:
      label: What got in the way
      description: Confusing steps, waiting, wrong refusals, too many questions, missing features.
    validations:
      required: true

  - type: dropdown
    id: keep_using
    attributes:
      label: Will you keep using it?
      options:
        - "Yes, on real work"
        - "Yes, but only for some tickets"
        - "Not yet: something has to change first"
        - "No"
    validations:
      required: true

  - type: textarea
    id: one_change
    attributes:
      label: The one change that would matter most
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: invar --version, claude --version, OS
      placeholder: invar 0.1.3, Claude Code 2.1.309, macOS 15 arm64
